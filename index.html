
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Wishlist ♡</title>
<style>
:root {
  --navy:#14243b;
  --cream:#f8f4ec;
  --gold:#d6bd91;
}
* { box-sizing:border-box; }
body {
  margin:0;
  font-family:Arial,sans-serif;
  background:var(--cream);
  color:var(--navy);
}
header {
  background:var(--navy);
  color:var(--gold);
  padding:22px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}
.logo { font:26px Georgia,serif; }
.hero {
  background:linear-gradient(120deg,#233d5e,#101b2b);
  text-align:center;
  color:var(--cream);
  padding:65px 20px;
}
h1 {
  color:var(--gold);
  font:clamp(38px,6vw,65px) Georgia,serif;
  margin:0;
}
.hero p { line-height:1.7; }
main {
  max-width:1100px;
  margin:auto;
  padding:35px 20px;
}
button {
  background:var(--navy);
  color:white;
  border:0;
  border-radius:25px;
  padding:12px 20px;
  cursor:pointer;
}
button:disabled { opacity:.5; }
.secondary {
  background:#e9dfcf;
  color:var(--navy);
}
.toolbar,.events,.actions {
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  align-items:center;
}
.toolbar {
  justify-content:space-between;
  margin:25px 0;
}
.events button.active {
  background:var(--gold);
  color:var(--navy);
}
.grid {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:22px;
}
.card {
  background:#fffcf7;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 5px 20px #14243b16;
}
.card img,.placeholder {
  width:100%;
  height:210px;
  object-fit:cover;
}
.placeholder {
  display:grid;
  place-items:center;
  background:#e9dfcf;
  font-size:55px;
}
.content { padding:20px; }
.content h3 { margin-top:0; }
.status {
  background:#dce9dc;
  padding:10px;
  border-radius:10px;
  margin:15px 0;
}
.status.taken {
  background:#263b56;
  color:white;
}
.actions button {
  font-size:13px;
  padding:9px 12px;
}
.hidden { display:none !important; }
.notice {
  background:#fff0d7;
  padding:14px;
  border-radius:10px;
  margin:20px 0;
}
dialog {
  width:min(480px,95vw);
  border:0;
  border-radius:20px;
  padding:25px;
}
dialog::backdrop { background:#07182bb0; }
label {
  display:block;
  margin-top:14px;
}
input,textarea {
  width:100%;
  padding:12px;
  margin-top:5px;
  border:1px solid #c7bcad;
  border-radius:9px;
  font:inherit;
}
textarea { min-height:80px; }
a { color:#42658c; }
footer {
  text-align:center;
  padding:35px;
  color:#777;
}
</style>
</head>
<body>

<header>
  <div class="logo">🎁 My Wishlist ♡</div>
  <button class="secondary" id="loginBtn">
    Вход владельца
  </button>
</header>

<section class="hero">
  <h1>My Wishlist ♡</h1>
  <p>Маленькие мечты, большие поводы для радости</p>
  <p>Подарки можно бронировать анонимно ✨</p>
</section>

<main>
  <div class="events" id="events"></div>

  <div class="toolbar">
    <div>
      <h2 id="eventTitle">Мои желания</h2>
      <span id="count"></span>
    </div>
    <div class="actions">
      <button class="secondary" id="share">
        Поделиться
      </button>
      <button class="hidden" id="addEvent">
        + Праздник
      </button>
      <button class="hidden" id="addGift">
        + Желание
      </button>
    </div>
  </div>

  <div id="notice" class="notice hidden"></div>
  <div id="grid" class="grid"></div>
</main>

<footer>С любовью ♡ My Wishlist</footer>

<dialog id="dialog">
  <h2 id="dialogTitle"></h2>
  <div id="dialogBody"></div>
  <div class="actions" style="margin-top:20px">
    <button class="secondary" id="closeDialog">
      Закрыть
    </button>
    <button id="saveDialog">Сохранить</button>
  </div>
</dialog>

<script type="module">
import {createClient} from
'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const supabase=createClient(
  'https://jbhxqbhjjtnduikvyvdj.supabase.co',
  'sb_publishable_yFAEmWU9KttyxjYD6XrACw_uVe31m-j'
);

const $=id=>document.getElementById(id);

const escapeHTML=value=>String(value??'')
  .replace(/[&<>"']/g,c=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[c]));

let events=[];
let gifts=[];
let reserved=new Set();
let selected=null;
let owner=false;

const dialog=$('dialog');

$('closeDialog').onclick=()=>dialog.close();

function notice(message) {
  $('notice').textContent=message;
  $('notice').classList.remove('hidden');
}

function showDialog(title,html,callback) {
  $('dialogTitle').textContent=title;
  $('dialogBody').innerHTML=html;
  $('saveDialog').onclick=callback;
  dialog.showModal();
}

function check(result) {
  if(result.error) throw result.error;
  return result.data;
}

async function load() {
  try {
    events=check(await supabase
      .from('wishlist_events')
      .select('*')
      .order('created_at'));

    gifts=check(await supabase
      .from('wishlist_gifts')
      .select('*')
      .order('created_at'));

    const statuses=check(await supabase
      .rpc('wishlist_reservation_status'));

    reserved=new Set(statuses.map(x=>x.gift_id));

    if(!events.some(e=>e.id===selected)) {
      selected=events[0]?.id??null;
    }

    render();
  } catch(error) {
    notice('Ошибка загрузки: '+error.message);
  }
}

function render() {
  $('loginBtn').textContent=owner
    ? 'Выйти'
    : 'Вход владельца';

  $('addEvent').classList.toggle('hidden',!owner);
  $('addGift').classList.toggle(
    'hidden',!owner||!selected
  );

  $('events').innerHTML=events.map(e=>`
    <button data-event="${e.id}"
      class="${selected===e.id?'active':''}">
      ${escapeHTML(e.title)}
    </button>
  `).join('');

  $('eventTitle').textContent=
    events.find(e=>e.id===selected)?.title
    ||'Мои желания';

  const items=gifts.filter(g=>g.event_id===selected);

  $('count').textContent=items.length+' желаний';

  $('grid').innerHTML=items.map(g=>{
    const taken=reserved.has(g.id);
    const token=localStorage.getItem(
      'wishlist_token_'+g.id
    );

    return `
      <article class="card">
        ${g.image_url
          ? `<img src="${escapeHTML(g.image_url)}"
                 alt="${escapeHTML(g.title)}">`
          : '<div class="placeholder">🎁</div>'}

        <div class="content">
          <h3>${escapeHTML(g.title)}</h3>
          <p>${g.price==null?'':escapeHTML(g.price)+' €'}</p>
          <p>${escapeHTML(g.description)}</p>

          ${g.product_url?`
            <p><a href="${escapeHTML(g.product_url)}"
              target="_blank" rel="noopener noreferrer">
              Посмотреть в магазине ↗
            </a></p>`:''}

          <div class="status ${taken?'taken':''}">
            ${taken?'🎁 Забронировано':'♡ Свободно'}
          </div>

          <div class="actions">
            ${owner?`
              <button data-edit="${g.id}">Изменить</button>
              <button data-delete="${g.id}">Удалить</button>
            `:!taken?`
              <button data-book="${g.id}">Забронировать</button>
            `:''}

            ${!owner&&taken&&token?`
              <button class="secondary" data-cancel="${g.id}">
                Отменить мою бронь
              </button>
            `:''}
          </div>
        </div>
      </article>`;
  }).join('')||'<p>Пока здесь нет желаний ♡</p>';
}

function validURL(value) {
  if(!value) return null;
  const url=new URL(value);
  if(!['http:','https:'].includes(url.protocol)) {
    throw Error('Нужна ссылка https://');
  }
  return url.href;
}

$('events').onclick=event=>{
  const button=event.target.closest('[data-event]');
  if(!button) return;
  selected=button.dataset.event;
  render();
};

$('share').onclick=async()=>{
  try {
    await navigator.clipboard.writeText(location.href);
    alert('Ссылка скопирована ♡');
  } catch {
    prompt('Скопируй ссылку:',location.href);
  }
};

async function refreshOwner() {
  const {data:{user}}=await supabase.auth.getUser();

  // Этот UID должен совпадать с владельцем,
  // указанным в правилах доступа Supabase.
  const OWNER_ID='49d8d725-76cc-47c4-9c25-04e1f999ce0f';

  owner=!!user&&user.id===OWNER_ID;
  render();
}

$('loginBtn').onclick=async()=>{
  if(owner) {
    await supabase.auth.signOut();
    owner=false;
    render();
    return;
  }

  showDialog('Вход владельца',`
    <label>Email</label>
    <input id="email" type="email">
    <label>Пароль</label>
    <input id="password" type="password">
  `,async()=>{
    try {
      check(await supabase.auth.signInWithPassword({
        email:$('email').value.trim(),
        password:$('password').value
      }));
      dialog.close();
      await refreshOwner();
    } catch(error) {
      alert(error.message);
    }
  });
};

$('addEvent').onclick=()=>{
  showDialog('Новый праздник',`
    <label>Название</label>
    <input id="eventName" placeholder="День рождения">
    <label>Дата</label>
    <input id="eventDate" type="date">
  `,async()=>{
    try {
      const title=$('eventName').value.trim();
      if(!title) throw Error('Укажи название');

      const result=check(await supabase
        .from('wishlist_events')
        .insert({
          title,
          event_date:$('eventDate').value||null
        })
        .select()
        .single());

      selected=result.id;
      dialog.close();
      await load();
    } catch(error) {
      alert(error.message);
    }
  });
};

function giftForm(gift) {
  showDialog(gift?'Изменить желание':'Новое желание',`
    <label>Название</label>
    <input id="giftName" value="${escapeHTML(gift?.title)}">

    <label>Цена, €</label>
    <input id="giftPrice" type="number" min="0"
      value="${escapeHTML(gift?.price)}">

    <label>Ссылка на фотографию</label>
    <input id="giftImage"
      value="${escapeHTML(gift?.image_url)}">

    <label>Ссылка на магазин</label>
    <input id="giftURL"
      value="${escapeHTML(gift?.product_url)}">

    <label>Комментарий</label>
    <textarea id="giftDescription">${escapeHTML(
      gift?.description
    )}</textarea>
  `,async()=>{
    try {
      const title=$('giftName').value.trim();
      if(!title) throw Error('Укажи название');

      const data={
        title,
        price:$('giftPrice').value===''
          ?null:Number($('giftPrice').value),
        image_url:validURL($('giftImage').value.trim()),
        product_url:validURL($('giftURL').value.trim()),
        description:$('giftDescription').value.trim()
      };

      if(gift) {
        check(await supabase.from('wishlist_gifts')
          .update(data).eq('id',gift.id));
      } else {
        check(await supabase.from('wishlist_gifts')
          .insert({...data,event_id:selected}));
      }

      dialog.close();
      await load();
    } catch(error) {
      alert(error.message);
    }
  });
}

$('addGift').onclick=()=>giftForm(null);

$('grid').onclick=async event=>{
  const button=event.target.closest('button');
  if(!button) return;

  const id=button.dataset.edit
    ||button.dataset.delete
    ||button.dataset.book
    ||button.dataset.cancel;

  const gift=gifts.find(g=>g.id===id);
  if(!gift) return;

  if(button.dataset.edit) {
    giftForm(gift);
    return;
  }

  if(button.dataset.delete) {
    if(!confirm('Удалить желание?')) return;
    try {
      check(await supabase.from('wishlist_gifts')
        .delete().eq('id',id));
      await load();
    } catch(error) {
      alert(error.message);
    }
    return;
  }

  if(button.dataset.book) {
    showDialog('Тайная бронь 🎁',`
      <p>Забронировать «${escapeHTML(gift.title)}»?</p>
      <p>Твоё имя никто не увидит.</p>
    `,async()=>{
      try {
        const bytes=crypto.getRandomValues(
          new Uint8Array(32)
        );
        const token=Array.from(bytes,x=>
          x.toString(16).padStart(2,'0')
        ).join('');

        const success=check(await supabase.rpc(
          'wishlist_book',
          {p_gift_id:id,p_token:token}
        ));

        if(!success) {
          throw Error('Подарок уже забронирован');
        }

        localStorage.setItem(
          'wishlist_token_'+id,token
        );
        dialog.close();
        await load();
        alert('Подарок забронирован ♡');
      } catch(error) {
        alert(error.message);
      }
    });
    return;
  }

  if(button.dataset.cancel) {
    if(!confirm('Отменить свою бронь?')) return;
    try {
      const token=localStorage.getItem(
        'wishlist_token_'+id
      );

      const success=check(await supabase.rpc(
        'wishlist_cancel',
        {p_gift_id:id,p_token:token}
      ));

      if(!success) throw Error('Бронь не найдена');

      localStorage.removeItem(
        'wishlist_token_'+id
      );
      await load();
    } catch(error) {
      alert(error.message);
    }
  }
};

await refreshOwner();
await load();
</script>
</body>
</html>
